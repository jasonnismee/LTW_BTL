<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layout/main-layout :: head('Checkout')}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/main-layout :: topnav}"></th:block>

<div class="container py-4">
  <h3 class="mb-3">Thanh toán (Online)</h3>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card">
        <div class="card-header">Giỏ hàng</div>
        <div class="card-body">
          <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info mb-0">
            Giỏ hàng đang trống. <a th:href="@{/customer/home}">Quay lại menu</a>
          </div>
          <div th:unless="${#lists.isEmpty(cartItems)}">
            <ul class="list-group">
              <li class="list-group-item d-flex justify-content-between" th:each="ci : ${cartItems}">
                <div>
                  <div class="fw-semibold" th:text="${ci.menuItemName}">Name</div>
                  <div class="small text-muted">
                    <span th:text="${ci.quantity}">1</span> ×
                    <span th:text="${#numbers.formatDecimal(ci.unitPrice,0,'COMMA',0,'POINT')} + ' ₫'">0</span>
                  </div>
                </div>
                <div class="fw-bold" th:text="${#numbers.formatDecimal(ci.subtotal,0,'COMMA',0,'POINT')} + ' ₫'">0</div>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <form th:action="@{/customer/checkout}" method="post" th:object="${order}" class="card">
        <div class="card-header">Thông tin giao hàng</div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Địa chỉ giao hàng</label>
            <input class="form-control" th:field="*{deliveryAddress}" required maxlength="300">
          </div>
          <div class="mb-3">
            <label class="form-label">Ghi chú</label>
            <textarea class="form-control" th:field="*{customerNote}" rows="2" maxlength="500"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Phương thức thanh toán</label>
            <select class="form-select" th:field="*{paymentMethod}">
              <option th:value="CASH">Tiền mặt</option>
              <option th:value="BANKING">Chuyển khoản</option>
              <option th:value="ZALO_PAY">ZaloPay</option>
              <option th:value="VNPAY">VNPay</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Voucher (rank hiện tại: <span th:text="${rank}">BRONZE</span>)</label>
            <select class="form-select" id="voucherSelect" name="voucherId" onchange="previewVoucher()">
              <option value="">Không dùng voucher</option>
              <option th:each="v: ${vouchers}"
                      th:value="${v.id}"
                      th:selected="${bestVoucherId != null and v.id == bestVoucherId}"
                      th:text="${v.code + ' - ' + v.discountPercent + '% (min ' + #numbers.formatDecimal(v.minOrderAmount,0,'COMMA',0,'POINT') + ' ₫)'}">
              </option>
            </select>
            <div class="form-text" id="voucherMessage"></div>
          </div>

          <hr>
          <div class="d-flex justify-content-between">
            <div>Tổng</div>
            <div class="fw-bold" id="totalPrice" th:text="${#numbers.formatDecimal(totalPrice,0,'COMMA',0,'POINT')} + ' ₫'">0</div>
          </div>
          <div class="d-flex justify-content-between">
            <div>Giảm giá</div>
            <div class="fw-bold text-success" id="discountAmount">0 ₫</div>
          </div>
          <div class="d-flex justify-content-between mt-2">
            <div class="fw-bold">Thanh toán</div>
            <div class="fw-bold text-danger" id="finalPrice" th:text="${#numbers.formatDecimal(totalPrice,0,'COMMA',0,'POINT')} + ' ₫'">0</div>
          </div>
        </div>
        <div class="card-footer text-end">
          <button class="btn btn-success" type="submit">Đặt hàng</button>
        </div>
      </form>
    </div>
  </div>
</div>

<th:block th:replace="~{layout/main-layout :: footer}"></th:block>
<th:block th:replace="~{layout/main-layout :: scripts}"></th:block>
<script>
  async function previewVoucher() {
    const sel = document.getElementById('voucherSelect');
    const voucherId = sel.value;
    const msg = document.getElementById('voucherMessage');
    const discountEl = document.getElementById('discountAmount');
    const finalEl = document.getElementById('finalPrice');

    if (!voucherId) {
      msg.textContent = 'Không áp dụng voucher';
      discountEl.textContent = '0 ₫';
      finalEl.textContent = document.getElementById('totalPrice').textContent;
      return;
    }

    const res = await fetch(`/customer/checkout/preview?voucherId=${voucherId}`);
    const data = await res.json();
    msg.textContent = data.message || '';
    if (!data.valid) {
      msg.className = 'form-text text-danger';
    } else {
      msg.className = 'form-text text-success';
    }
    discountEl.textContent = formatVnd(data.discountAmount);
    finalEl.textContent = formatVnd(data.finalPrice);
  }

  function formatVnd(value) {
    const n = Number(value || 0);
    return n.toLocaleString('vi-VN') + ' ₫';
  }

  window.addEventListener('load', previewVoucher);
</script>
</body>
</html>
