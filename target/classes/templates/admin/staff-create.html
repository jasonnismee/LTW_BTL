<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="layout/main-layout :: head('Thêm nhân viên')"></th:block>
</head>
<body>
<th:block th:replace="layout/sidebar-layout :: adminPage(${activeMenu}, ~{::section})">
  <section>
    <div class="container-fluid py-3" style="max-width: 560px;">
      <h3 class="mb-3">Thêm tài khoản nhân viên</h3>
      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <form th:action="@{/admin/staff/create}" method="post" th:object="${staff}" class="card border-0 shadow-sm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
            <input class="form-control" th:field="*{username}" required minlength="3" maxlength="30" autocomplete="off">
            <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu <span class="text-danger">*</span></label>
            <input class="form-control" type="password" th:field="*{password}" required minlength="6" maxlength="100" autocomplete="new-password">
            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Họ tên <span class="text-danger">*</span></label>
            <input class="form-control" th:field="*{fullName}" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Số điện thoại <span class="text-danger">*</span></label>
            <input class="form-control" th:field="*{phone}" required placeholder="0xxxxxxxxx">
            <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" th:field="*{email}" placeholder="(tuỳ chọn)">
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
          </div>
          <div class="d-flex gap-2 justify-content-end">
            <a class="btn btn-outline-secondary" th:href="@{/admin/users}">Quản lý user</a>
            <button class="btn btn-primary" type="submit">Tạo nhân viên</button>
          </div>
        </div>
      </form>
    </div>
  </section>
</th:block>
<th:block th:replace="layout/main-layout :: scripts"></th:block>
</body>
</html>
