<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="layout/main-layout :: head('Quản lý Voucher')"></th:block>
</head>
<body>
<th:block th:replace="layout/sidebar-layout :: adminPage(${activeMenu}, ~{::section})">
  <section>
    <div class="container-fluid py-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Quản lý Voucher</h3>
        <a class="btn btn-primary" th:href="@{/admin/vouchers/create}">Tạo voucher</a>
      </div>

      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead>
          <tr>
            <th>Mã</th>
            <th>Loại</th>
            <th class="text-end">Giảm %</th>
            <th>Hạng tối thiểu</th>
            <th>Trạng thái</th>
            <th class="text-end">Thao tác</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="v : ${vouchers}">
            <td><code th:text="${v.code}">CODE</code></td>
            <td th:text="${v.type.name() == 'ONLINE_RANK_ONLY'} ? 'Online (theo hạng)' : 'Offline (tại quán)'">TYPE</td>
            <td class="text-end" th:text="${v.discountPercent} + '%'">0</td>
            <td th:text="${v.minRank != null} ? ${v.minRank} : '—'">-</td>
            <td>
              <span class="badge" th:classappend="${v.status} ? 'bg-success' : 'bg-secondary'"
                    th:text="${v.status} ? 'Đang bật' : 'Đang tắt'">ACTIVE</span>
            </td>
            <td class="text-end">
              <form th:action="@{'/admin/vouchers/' + ${v.id} + '/toggle-status'}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button th:if="${v.status}" class="btn btn-sm btn-outline-warning" type="submit">Tắt</button>
                <button th:unless="${v.status}" class="btn btn-sm btn-outline-success" type="submit">Bật</button>
              </form>
              <form th:action="@{'/admin/vouchers/' + ${v.id}}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="_method" value="delete">
                <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</th:block>

<th:block th:replace="layout/main-layout :: scripts"></th:block>
</body>
</html>
