<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layout/main-layout :: head('Quản lý User')}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/sidebar-layout :: adminPage(${activeMenu}, ~{::section})}">
  <section>
    <div class="container-fluid py-3">
      <h3 class="mb-3">Quản lý User</h3>
      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <form method="get" th:action="@{/admin/users}" class="row g-2 mb-3">
        <div class="col-md-3">
          <select class="form-select form-select-sm" name="role">
            <option value="">Tất cả vai trò</option>
            <option value="ADMIN" th:selected="${role != null and role.name() == 'ADMIN'}">ADMIN</option>
            <option value="STAFF" th:selected="${role != null and role.name() == 'STAFF'}">STAFF</option>
            <option value="CUSTOMER" th:selected="${role != null and role.name() == 'CUSTOMER'}">CUSTOMER</option>
          </select>
        </div>
        <div class="col-md-5">
          <input class="form-control form-control-sm" name="q" th:value="${q}" placeholder="Tìm username / họ tên...">
        </div>
        <div class="col-md-2">
          <button class="btn btn-outline-primary btn-sm w-100" type="submit">Lọc</button>
        </div>
      </form>

      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead>
          <tr>
            <th>Username</th>
            <th>Họ tên</th>
            <th>Role</th>
            <th>Rank</th>
            <th>Trạng thái</th>
            <th class="text-end">Thao tác</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="u : ${users}">
            <td th:text="${u.username}">u</td>
            <td th:text="${u.fullName}">name</td>
            <td th:text="${u.role}">role</td>
            <td th:text="${u.rank}">rank</td>
            <td>
              <span class="badge" th:classappend="${u.status.name() == 'ACTIVE'} ? 'bg-success' : 'bg-danger'"
                    th:text="${u.status}">ACTIVE</span>
            </td>
            <td class="text-end">
              <form th:if="${u.status.name() == 'ACTIVE'}" th:action="@{'/admin/users/' + ${u.id} + '/ban'}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-sm btn-outline-danger" type="submit">Khóa (ban)</button>
              </form>
              <form th:if="${u.status.name() == 'BANNED'}" th:action="@{'/admin/users/' + ${u.id} + '/unban'}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-sm btn-outline-success" type="submit">Mở khóa (unban)</button>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</th:block>

<th:block th:replace="~{layout/main-layout :: scripts}"></th:block>
</body>
</html>
