<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="layout/main-layout :: head('Tạo Voucher')"></th:block>
</head>
<body>
<th:block th:replace="layout/sidebar-layout :: adminPage(${activeMenu}, ~{::section})">
  <section>
    <div class="container-fluid py-3" style="max-width: 920px;">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Tạo voucher mới</h3>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/vouchers}">← Danh sách</a>
      </div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <form th:action="@{/admin/vouchers}" method="post" th:object="${voucher}" id="voucherCreateForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="card mb-3 border-0 shadow-sm">
          <div class="card-header bg-primary text-white py-2">Thông tin cơ bản</div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-5">
                <label class="form-label fw-semibold">Mã voucher <span class="text-danger">*</span></label>
                <input class="form-control" th:field="*{code}" required minlength="4" maxlength="20"
                       placeholder="VD: GIAM20" autocomplete="off">
                <div class="form-text">4–20 ký tự: chữ, số, gạch dưới.</div>
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold">Phần trăm giảm <span class="text-danger">*</span></label>
                <div class="input-group">
                  <input class="form-control" th:field="*{discountPercent}" type="number" min="1" max="100" required>
                  <span class="input-group-text">%</span>
                </div>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Kích hoạt khi tạo</label>
                <select class="form-select" th:field="*{status}">
                  <option th:value="true">Có (áp dụng ngay)</option>
                  <option th:value="false">Không (tạo nháp)</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="card mb-3 border-0 shadow-sm">
          <div class="card-header bg-secondary text-white py-2">Loại &amp; điều kiện áp dụng</div>
          <div class="card-body">
            <div class="mb-3">
              <label class="form-label fw-semibold">Loại voucher <span class="text-danger">*</span></label>
              <select class="form-select form-select-lg" th:field="*{type}" id="voucherTypeSelect" required>
                <option th:value="ONLINE_RANK_ONLY"
                        data-desc="Áp dụng đặt món online, có thể giới hạn theo hạng thành viên.">
                  Đặt online — theo hạng khách (ONLINE_RANK_ONLY)
                </option>
                <option th:value="OFFLINE_ALL"
                        data-desc="Dùng tại quán (POS), áp dụng cho mọi khách, không phân hạng.">
                  Tại quán — mọi khách (OFFLINE_ALL)
                </option>
              </select>
              <p class="form-text mb-0" id="typeHelpText">Chọn loại để hiển thị đúng các ô bên dưới.</p>
            </div>

            <div class="row g-3" id="minRankRow">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Hạng tối thiểu (online)</label>
                <select class="form-select" th:field="*{minRank}" id="minRankSelect">
                  <option value="">Mọi hạng (không giới hạn)</option>
                  <option th:each="r : ${ranks}" th:value="${r.name()}" th:text="${r.name()}">BRONZE</option>
                </select>
                <div class="form-text">Chỉ dùng khi loại là <strong>Đặt online</strong>. Khách đạt hạng này trở lên mới dùng được.</div>
              </div>
            </div>

            <div class="row g-3 mt-1">
              <div class="col-md-4">
                <label class="form-label fw-semibold">Đơn tối thiểu (₫) <span class="text-danger">*</span></label>
                <input class="form-control" th:field="*{minOrderAmount}" type="number" min="0" step="1000" required>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Giảm tối đa (₫)</label>
                <input class="form-control" th:field="*{maxDiscountAmount}" type="number" min="0" step="1000" placeholder="Để trống = không giới hạn">
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Số lượng mã <span class="text-danger">*</span></label>
                <input class="form-control" th:field="*{quantity}" type="number" required>
                <div class="form-text"><strong>-1</strong> = không giới hạn lượt dùng.</div>
              </div>
            </div>
          </div>
        </div>

        <div class="card mb-3 border-0 shadow-sm">
          <div class="card-header bg-dark text-white py-2">Thời gian hiệu lực</div>
          <div class="card-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Bắt đầu <span class="text-danger">*</span></label>
                <input class="form-control" th:field="*{startDate}" type="datetime-local" required>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Kết thúc <span class="text-danger">*</span></label>
                <input class="form-control" th:field="*{endDate}" type="datetime-local" required>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 pb-4">
          <a class="btn btn-outline-secondary" th:href="@{/admin/vouchers}">Hủy</a>
          <button class="btn btn-success px-4" type="submit">Lưu voucher</button>
        </div>
      </form>
    </div>
  </section>
</th:block>

<th:block th:replace="layout/main-layout :: scripts"></th:block>
<script>
  (function () {
    var typeSel = document.getElementById('voucherTypeSelect');
    var minRankRow = document.getElementById('minRankRow');
    var minRankSelect = document.getElementById('minRankSelect');
    var helpEl = document.getElementById('typeHelpText');
    if (!typeSel || !minRankRow || !minRankSelect) return;

    function sync() {
      var offline = typeSel.value === 'OFFLINE_ALL';
      if (offline) {
        minRankRow.style.display = 'none';
        minRankSelect.selectedIndex = 0;
        minRankSelect.value = '';
        minRankSelect.setAttribute('disabled', 'disabled');
        minRankSelect.removeAttribute('name');
      } else {
        minRankRow.style.display = '';
        minRankSelect.removeAttribute('disabled');
        minRankSelect.setAttribute('name', 'minRank');
      }
      var opt = typeSel.options[typeSel.selectedIndex];
      if (helpEl && opt && opt.getAttribute('data-desc')) {
        helpEl.textContent = opt.getAttribute('data-desc');
      }
    }

    typeSel.addEventListener('change', sync);
    sync();
  })();
</script>
</body>
</html>
