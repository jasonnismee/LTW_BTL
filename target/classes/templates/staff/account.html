<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="layout/main-layout :: head('Tài khoản')"></th:block>
</head>
<body>
<th:block th:replace="layout/sidebar-layout :: staffPage(${activeMenu}, ~{::section})">
  <section>
    <div class="container-fluid py-3" style="max-width: 640px;">
      <h3 class="mb-3">Quản lý tài khoản</h3>
      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

      <div class="card mb-4 border-0 shadow-sm">
        <div class="card-header bg-primary text-white">Thông tin cá nhân</div>
        <div class="card-body">
          <form th:action="@{/staff/account/profile}" method="post" th:object="${profile}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
              <label class="form-label">Họ tên</label>
              <input class="form-control" th:field="*{fullName}" required>
              <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Số điện thoại</label>
              <input class="form-control" th:field="*{phone}" required>
              <div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input class="form-control" type="email" th:field="*{email}" placeholder="Tuỳ chọn">
              <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <button class="btn btn-primary" type="submit">Lưu thông tin</button>
          </form>
        </div>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-header bg-secondary text-white">Đổi mật khẩu</div>
        <div class="card-body">
          <form th:action="@{/staff/account/password}" method="post" th:object="${passwordForm}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
              <label class="form-label">Mật khẩu hiện tại</label>
              <input class="form-control" type="password" th:field="*{currentPassword}" required autocomplete="current-password">
              <div class="text-danger small" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Mật khẩu mới</label>
              <input class="form-control" type="password" th:field="*{newPassword}" required minlength="6" autocomplete="new-password">
              <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Nhập lại mật khẩu mới</label>
              <input class="form-control" type="password" th:field="*{confirmPassword}" required autocomplete="new-password">
              <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>
            <button class="btn btn-outline-primary" type="submit">Đổi mật khẩu</button>
          </form>
        </div>
      </div>
    </div>
  </section>
</th:block>
<th:block th:replace="layout/main-layout :: scripts"></th:block>
</body>
</html>
