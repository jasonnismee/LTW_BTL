<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layout/main-layout :: head('Đăng nhập')}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/main-layout :: topnav}"></th:block>

<div class="container py-5" style="max-width: 480px;">
  <h3 class="mb-3">Đăng nhập</h3>

  <div th:if="${param.error}" class="alert alert-danger">Sai username hoặc password.</div>
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

  <form th:action="@{/auth/login}" method="post" class="card card-body">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input class="form-control" name="username" required minlength="3" maxlength="30">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" required>
    </div>
    <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
  </form>

  <div class="mt-3 small">
    Chưa có tài khoản? <a th:href="@{/auth/register}">Đăng ký</a>
  </div>

  <div class="mt-4 small text-muted">
    Tài khoản seed: admin / staff1 / staff2 / customer1... (password: <b>password123</b>)
  </div>
</div>

<th:block th:replace="~{layout/main-layout :: scripts}"></th:block>
</body>
</html>
