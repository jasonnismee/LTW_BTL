<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>
  <!-- Admin sidebar -->
  <aside th:fragment="adminSidebar(activeMenu)" class="col-md-2 d-none d-md-block bg-light border-end min-vh-100 py-3">
    <div class="list-group">
      <a class="list-group-item list-group-item-action" th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''"
        th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
      <a class="list-group-item list-group-item-action" th:classappend="${activeMenu == 'menu'} ? 'active' : ''"
        th:href="@{/admin/menu}"><i class="bi bi-card-list me-1"></i> Menu</a>
      <a class="list-group-item list-group-item-action" th:classappend="${activeMenu == 'vouchers'} ? 'active' : ''"
        th:href="@{/admin/vouchers}"><i class="bi bi-ticket-perforated me-1"></i> Vouchers</a>
      <a class="list-group-item list-group-item-action" th:classappend="${activeMenu == 'orders'} ? 'active' : ''"
        th:href="@{/admin/orders}"><i class="bi bi-receipt-cutoff me-1"></i> Quản lý đơn</a>
      <a class="list-group-item list-group-item-action" th:classappend="${activeMenu == 'users'} ? 'active' : ''"
        th:href="@{/admin/users}"><i class="bi bi-people me-1"></i> Users</a>
      <a class="list-group-item list-group-item-action" th:classappend="${activeMenu == 'staffCreate'} ? 'active' : ''"
        th:href="@{/admin/staff/create}"><i class="bi bi-person-badge me-1"></i> Thêm nhân viên</a>
    </div>
  </aside>

  <!-- Staff sidebar -->
  <aside th:fragment="staffSidebar(activeMenu)" class="col-md-2 d-none d-md-block bg-light border-end min-vh-100 py-3">
    <div class="list-group">
      <a class="list-group-item list-group-item-action" th:classappend="${activeMenu == 'pos'} ? 'active' : ''"
        th:href="@{/staff/pos}"><i class="bi bi-shop me-1"></i> POS</a>
      <a class="list-group-item list-group-item-action" th:classappend="${activeMenu == 'onlineOrders'} ? 'active' : ''"
        th:href="@{/staff/orders/online}"><i class="bi bi-truck me-1"></i> Online Orders</a>
      <a class="list-group-item list-group-item-action" th:classappend="${activeMenu == 'account'} ? 'active' : ''"
        th:href="@{/staff/account}"><i class="bi bi-person-gear me-1"></i> Tài khoản</a>
    </div>
  </aside>

  <!-- Alerts -->
  <div th:fragment="alerts" class="mb-3">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
  </div>

  <!-- Admin page shell -->
  <div th:fragment="adminPage(activeMenu, content)">
    <th:block th:replace="~{layout/main-layout :: topnav}"></th:block>
    <div class="container-fluid">
      <div class="row">
        <th:block th:replace="~{layout/sidebar-layout :: adminSidebar(${activeMenu})}"></th:block>
        <main class="col-12 col-md-10 py-3">
          <th:block th:replace="~{layout/sidebar-layout :: alerts}"></th:block>
          <th:block th:replace="${content}"></th:block>
        </main>
      </div>
    </div>
  </div>

  <!-- Staff page shell -->
  <div th:fragment="staffPage(activeMenu, content)">
    <th:block th:replace="~{layout/main-layout :: topnav}"></th:block>
    <div class="container-fluid">
      <main class="col-12 py-3">
        <th:block th:replace="~{layout/sidebar-layout :: alerts}"></th:block>
        <th:block th:replace="${content}"></th:block>
      </main>
    </div>
  </div>
</body>

</html>
