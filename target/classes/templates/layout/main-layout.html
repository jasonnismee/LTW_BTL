<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Restaurant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="topnav" class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Restaurant</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <!-- CUSTOMER navigation -->
        <li class="nav-item"
            th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}">
          <a class="nav-link" th:href="@{/customer/home}">Menu</a>
        </li>
        <li class="nav-item"
            th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}">
          <a class="nav-link" th:href="@{/customer/cart}">
            <i class="bi bi-cart"></i> Giỏ hàng
            <span class="badge bg-warning text-dark ms-1"
                  th:text="${session.CART != null ? #lists.size(session.CART) : 0}">0</span>
          </a>
        </li>
        <li class="nav-item"
            th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}">
          <a class="nav-link" th:href="@{/customer/orders}">Đơn của tôi</a>
        </li>
        <li class="nav-item"
            th:if="${#authorization.expression('hasRole(''CUSTOMER'')')}">
          <a class="nav-link" th:href="@{/customer/account}">Tài khoản</a>
        </li>

        <!-- STAFF navigation -->
        <li class="nav-item"
            th:if="${#authorization.expression('hasRole(''STAFF'')')}">
          <a class="nav-link" th:href="@{/staff/pos}">POS</a>
        </li>
        <li class="nav-item"
            th:if="${#authorization.expression('hasRole(''STAFF'')')}">
          <a class="nav-link" th:href="@{/staff/orders/online}">Đơn online</a>
        </li>

        <!-- ADMIN shortcut -->
        <li class="nav-item"
            th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
          <a class="nav-link" th:href="@{/admin/dashboard}">Admin</a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
          <form th:action="@{/auth/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="nav-link btn btn-link p-0">Đăng xuất</button>
          </form>
        </li>
        <li class="nav-item" th:unless="${#authorization.expression('isAuthenticated()')}">
          <a class="nav-link" th:href="@{/auth/login}">Đăng nhập</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<footer th:fragment="footer" class="border-top mt-5 py-4">
  <div class="container small text-muted">
    © <span th:text="${#dates.format(#dates.createNow(),'yyyy')}">2026</span> Restaurant System
  </div>
</footer>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
