<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="layout/main-layout :: head('Quản lý Menu')"></th:block>
</head>
<body>
<th:block th:replace="layout/sidebar-layout :: adminPage(${activeMenu}, ~{::section})">
  <section>
    <div class="container py-4">
      <h3 class="mb-3">Quản lý Menu</h3>

      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card">
            <div class="card-header">Danh mục</div>
            <div class="card-body">
              <form th:action="@{/admin/menu/category}" method="post" class="d-flex gap-2 mb-3">
                <input class="form-control" name="name" placeholder="Tên danh mục..." required>
                <button class="btn btn-primary" type="submit">Thêm</button>
              </form>
              <ul class="list-group">
                <li class="list-group-item d-flex justify-content-between align-items-center" th:each="c : ${categories}">
                  <span th:text="${c.name}">Category</span>
                  <form th:action="@{'/admin/menu/category/' + ${c.id}}" method="post" class="d-flex gap-2">
                    <input type="hidden" name="_method" value="delete">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                  </form>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card mb-3">
            <div class="card-header">Tạo món ăn</div>
            <div class="card-body">
              <form th:action="@{/admin/menu/item}" method="post" enctype="multipart/form-data" th:object="${menuItem}">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Tên món</label>
                    <input class="form-control" th:field="*{name}" required>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Giá</label>
                    <input class="form-control" th:field="*{price}" required>
                  </div>
                  <div class="col-md-3">
                    <label class="form-label">Danh mục</label>
                    <select class="form-select" th:field="*{categoryId}">
                      <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Category</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Mô tả</label>
                    <textarea class="form-control" th:field="*{description}" rows="2"></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Ảnh</label>
                    <input type="file" class="form-control" th:field="*{imageFile}" accept="image/*">
                  </div>
                </div>
                <button class="btn btn-success mt-3" type="submit">Tạo món</button>
              </form>
            </div>
          </div>

          <div class="card">
            <div class="card-header">Danh sách món</div>
            <div class="card-body table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                <tr>
                  <th>Tên</th>
                  <th>Danh mục</th>
                  <th class="text-end">Giá</th>
                  <th>Trạng thái</th>
                  <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${items}">
                  <td th:text="${m.name}">Name</td>
                  <td th:text="${m.category != null ? m.category.name : ''}">Cat</td>
                  <td class="text-end" th:text="${#numbers.formatDecimal(m.price,0,'COMMA',0,'POINT')} + ' ₫'">0</td>
                  <td><span class="badge bg-secondary" th:text="${m.status}">AVAILABLE</span></td>
                  <td class="text-end">
                    <form th:action="@{'/admin/menu/item/' + ${m.id} + '/toggle-status'}" method="post" class="d-inline">
                      <button class="btn btn-sm btn-outline-primary" type="submit">Toggle</button>
                    </form>
                    <form th:action="@{'/admin/menu/item/' + ${m.id}}" method="post" class="d-inline">
                      <input type="hidden" name="_method" value="delete">
                      <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
                    </form>
                  </td>
                </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</th:block>

<th:block th:replace="layout/main-layout :: scripts"></th:block>
</body>
</html>
