<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="layout/main-layout :: head('Quản lý Voucher')"></th:block>
</head>
<body>
<th:block th:replace="layout/main-layout :: topnav"></th:block>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Quản lý Voucher</h3>
    <a class="btn btn-primary" th:href="@{/admin/vouchers/create}">Tạo voucher</a>
  </div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
      <tr>
        <th>Code</th>
        <th>Type</th>
        <th class="text-end">%</th>
        <th>MinRank</th>
        <th>Active</th>
        <th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="v : ${vouchers}">
        <td th:text="${v.code}">CODE</td>
        <td th:text="${v.type}">TYPE</td>
        <td class="text-end" th:text="${v.discountPercent}">0</td>
        <td th:text="${v.minRank}">-</td>
        <td>
          <span class="badge" th:classappend="${v.status} ? 'bg-success' : 'bg-danger'"
                th:text="${v.status} ? 'ACTIVE' : 'INACTIVE'">ACTIVE</span>
        </td>
        <td class="text-end">
          <form th:action="@{'/admin/vouchers/' + ${v.id} + '/toggle-status'}" method="post" class="d-inline">
            <button class="btn btn-sm btn-outline-primary" type="submit">Toggle</button>
          </form>
          <form th:action="@{'/admin/vouchers/' + ${v.id}}" method="post" class="d-inline">
            <input type="hidden" name="_method" value="delete">
            <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<th:block th:replace="layout/main-layout :: scripts"></th:block>
</body>
</html>
