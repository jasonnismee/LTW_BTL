<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="layout/main-layout :: head('Giỏ hàng')"></th:block>
</head>
<body>
<th:block th:replace="layout/main-layout :: topnav"></th:block>

<div class="container py-4">
  <h3 class="mb-3">Giỏ hàng</h3>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">
    Giỏ hàng đang trống. <a th:href="@{/customer/home}">Xem menu</a>
  </div>

  <div th:unless="${#lists.isEmpty(cartItems)}">
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
        <tr>
          <th>Món</th>
          <th class="text-end">Đơn giá</th>
          <th class="text-center" style="width: 220px;">Số lượng</th>
          <th class="text-end">Thành tiền</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ci : ${cartItems}">
          <td th:text="${ci.menuItemName}">Name</td>
          <td class="text-end" th:text="${#numbers.formatDecimal(ci.unitPrice,0,'COMMA',0,'POINT')} + ' ₫'">0</td>
          <td>
            <form th:action="@{/customer/cart/update}" method="post" class="d-flex gap-2 justify-content-center">
              <input type="hidden" name="menuItemId" th:value="${ci.menuItemId}">
              <input type="number" name="quantity" min="1" class="form-control form-control-sm" style="width: 90px;" th:value="${ci.quantity}">
              <button class="btn btn-sm btn-outline-primary" type="submit">Cập nhật</button>
            </form>
          </td>
          <td class="text-end" th:text="${#numbers.formatDecimal(ci.subtotal,0,'COMMA',0,'POINT')} + ' ₫'">0</td>
          <td class="text-end">
            <form th:action="@{/customer/cart/remove}" method="post">
              <input type="hidden" name="menuItemId" th:value="${ci.menuItemId}">
              <button class="btn btn-sm btn-outline-danger" type="submit">Xóa</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center">
      <form th:action="@{/customer/cart/clear}" method="post">
        <button class="btn btn-outline-danger" type="submit">Xóa giỏ hàng</button>
      </form>
      <div class="text-end">
        <div class="small text-muted">Tổng</div>
        <div class="fs-4 fw-bold" th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + ' ₫'">0</div>
        <a class="btn btn-success mt-2" th:href="@{/customer/checkout}">Tiến hành đặt hàng</a>
      </div>
    </div>
  </div>
</div>

<th:block th:replace="layout/main-layout :: footer"></th:block>
<th:block th:replace="layout/main-layout :: scripts"></th:block>
</body>
</html>
