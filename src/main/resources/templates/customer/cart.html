<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{layout/main-layout :: head('Giỏ hàng')}"></th:block>
</head>
<body>
<th:block th:replace="~{layout/main-layout :: topnav}"></th:block>

<div class="container py-4">
  <h3 class="mb-3">Giỏ hàng</h3>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info">
    Giỏ hàng đang trống. <a th:href="@{/customer/home}">Xem menu</a>
  </div>

  <div th:unless="${#lists.isEmpty(cartItems)}">
    <th:block th:each="ci : ${cartItems}">
      <form th:action="@{/customer/cart/remove}" method="post" th:id="${'remove-' + ci.menuItemId}" class="d-none">
        <input type="hidden" name="menuItemId" th:value="${ci.menuItemId}">
      </form>
    </th:block>
    <form id="clearForm" th:action="@{/customer/cart/clear}" method="post" class="d-none"></form>

    <form id="cartCheckoutForm" th:action="@{/customer/cart/proceed-to-checkout}" method="post">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
          <tr>
            <th>Món</th>
            <th class="text-end">Đơn giá</th>
            <th class="text-center" style="width: 160px;">Số lượng</th>
            <th class="text-end">Thành tiền</th>
            <th></th>
          </tr>
          </thead>
          <tbody id="cartRowsBody">
          <tr th:each="ci : ${cartItems}" th:attr="data-unit-price=${ci.unitPrice}">
            <td th:text="${ci.menuItemName}">Name</td>
            <td class="text-end" th:text="${#numbers.formatDecimal(ci.unitPrice,0,'COMMA',0,'POINT')} + ' ₫'">0</td>
            <td class="text-center">
              <input type="hidden" name="menuItemId" th:value="${ci.menuItemId}">
              <input type="number" name="quantity" min="1" class="form-control form-control-sm d-inline-block js-cart-qty" style="width: 90px;" th:value="${ci.quantity}">
            </td>
            <td class="text-end js-cart-line-total" th:text="${#numbers.formatDecimal(ci.subtotal,0,'COMMA',0,'POINT')} + ' ₫'">0</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-danger" type="submit" th:form="${'remove-' + ci.menuItemId}">Xóa</button>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center">
        <button class="btn btn-outline-danger" type="submit" form="clearForm">Xóa giỏ hàng</button>
        <div class="text-end">
          <div class="small text-muted">Tổng</div>
          <div id="cartGrandTotal" class="fs-4 fw-bold" th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + ' ₫'">0</div>
          <button class="btn btn-success mt-2" type="submit">Tiến hành đặt hàng</button>
        </div>
      </div>
    </form>
  </div>
</div>

<th:block th:replace="~{layout/main-layout :: footer}"></th:block>
<th:block th:replace="~{layout/main-layout :: scripts}"></th:block>
<script>
  (function () {
    var tbody = document.getElementById('cartRowsBody');
    var grandEl = document.getElementById('cartGrandTotal');
    if (!tbody || !grandEl) return;

    function formatVnd(n) {
      var x = Math.round(Number(n));
      if (!isFinite(x)) x = 0;
      return x.toLocaleString('vi-VN') + ' ₫';
    }

    function getQty(input) {
      var q = parseInt(input.value, 10);
      if (!isFinite(q) || q < 1) return 1;
      return q;
    }

    function clampQty(input) {
      var q = parseInt(input.value, 10);
      if (!isFinite(q) || q < 1) input.value = 1;
    }

    function recalc() {
      var rows = tbody.querySelectorAll('tr[data-unit-price]');
      var total = 0;
      rows.forEach(function (tr) {
        var unit = parseFloat(tr.getAttribute('data-unit-price'));
        if (!isFinite(unit)) unit = 0;
        var input = tr.querySelector('.js-cart-qty');
        var lineEl = tr.querySelector('.js-cart-line-total');
        var qty = input ? getQty(input) : 1;
        var line = unit * qty;
        total += line;
        if (lineEl) lineEl.textContent = formatVnd(line);
      });
      grandEl.textContent = formatVnd(total);
    }

    tbody.addEventListener('input', function (e) {
      if (e.target && e.target.classList.contains('js-cart-qty')) recalc();
    });
    tbody.addEventListener('change', function (e) {
      if (e.target && e.target.classList.contains('js-cart-qty')) {
        clampQty(e.target);
        recalc();
      }
    });
    recalc();
  })();
</script>
</body>
</html>
