server:
  port: 8080
  servlet:
    session:
      timeout: 5m

spring:
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  # createDatabaseIfNotExist: tạo schema restaurant_db nếu MySQL chưa có.
  # ddl-auto create: mỗi lần khởi động app xóa và tạo lại bảng từ entity (reset về trạng thái gốc), sau đó DataSeeder nạp dữ liệu mẫu.
  # Khi triển khai thật, đổi ddl-auto thành validate hoặc update và bỏ createDatabaseIfNotExist nếu không cần.
  datasource:
    url: jdbc:mysql://localhost:3306/restaurant_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  upload:
    dir: ./uploads
    web-path-prefix: /uploads/

logging:
  level:
    com.restaurant: INFO
